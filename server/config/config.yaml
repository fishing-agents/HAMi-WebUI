server:
  http:
    addr: 0.0.0.0:8000
    timeout: 60s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 60s
prometheus:
  address: http://localhost:9090
  timeout: 1m
exporter:
  interval: 30s
  timeout: 60s
  # NVIDIA card telemetry source: dcgm (DCGM exporter) or hami (HAMi vGPUmonitor).
  nvidia_telemetry: dcgm
node_selectors:
  NVIDIA: gpu=on
  Ascend: ascend=on
  DCU: dcu=on
  HCU: hcu=on
  MLU: mlu=on
  Metax: metax-tech.com/gpu.installed=true
